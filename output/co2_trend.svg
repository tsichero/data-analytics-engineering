<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420"><title>CO₂ emissions — Brazil vs World</title><desc>Reproducible fixture with Brazil and World values for 2023 and 2024.</desc><rect width="900" height="420" fill="#07111f"/><text x="55" y="48" fill="#f8fafc" font-family="Arial" font-size="24">CO₂ emissions — Brazil vs World</text><text x="55" y="76" fill="#94a3b8" font-family="Arial" font-size="14">Reproducible local fixture · million tonnes</text><line x1="90" y1="350" x2="850" y2="350" stroke="#64748b"/><line x1="90" y1="110" x2="90" y2="350" stroke="#64748b"/><polyline points="230,347 700,347" fill="none" stroke="#38bdf8" stroke-width="4"/><polyline points="230,118 700,110" fill="none" stroke="#a78bfa" stroke-width="4"/><circle cx="230" cy="347" r="6" fill="#38bdf8"/><circle cx="700" cy="347" r="6" fill="#38bdf8"/><circle cx="230" cy="118" r="6" fill="#a78bfa"/><circle cx="700" cy="110" r="6" fill="#a78bfa"/><text x="215" y="380" fill="#cbd5e1" font-family="Arial" font-size="14">2023</text><text x="685" y="380" fill="#cbd5e1" font-family="Arial" font-size="14">2024</text><text x="105" y="342" fill="#cbd5e1" font-family="Arial" font-size="12">Brazil: 466 → 483 Mt</text><text x="105" y="128" fill="#cbd5e1" font-family="Arial" font-size="12">World: 37,400 → 38,600 Mt</text></svg>